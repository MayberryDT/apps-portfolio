<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isometric Vitreous Planes</title>
    <style>
        :root {
            --glass-edge: rgba(255, 255, 255, 0.4);
            --glass-surface: rgba(255, 255, 255, 0.05);
            --glass-shadow: rgba(0, 0, 0, 0.2);
            --accent: #00f0ff;
            --bg-dark: #0a0a0a;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(45deg, #050505 25%, transparent 25%, transparent 75%, #050505 75%, #050505),
                linear-gradient(45deg, #050505 25%, transparent 25%, transparent 75%, #050505 75%, #050505);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace; /* Precise data feel */
            overflow: hidden;
            margin: 0;
            perspective: 1200px;
        }

        .scene {
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(55deg) rotateZ(-45deg);
            transition: transform 0.5s ease;
        }

        /* The Card Assembly */
        .assembly {
            position: relative;
            width: 300px;
            height: 400px;
            transform-style: preserve-3d;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .assembly:hover {
            transform: translateZ(40px);
        }

        .assembly:hover .layer-base { transform: translateZ(0px); }
        .assembly:hover .layer-content { transform: translateZ(40px); }
        .assembly:hover .layer-glass { transform: translateZ(80px); }
        .assembly:hover .layer-ui { transform: translateZ(100px); }

        /* Generic Layer Logic */
        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transition: all 0.4s ease-out;
            border-radius: 4px;
        }

        /* 1. Base Dark Panel */
        .layer-base {
            background: #111;
            box-shadow: 
                10px 10px 30px rgba(0,0,0,0.5),
                inset 0 0 0 1px #222;
            transform: translateZ(0);
        }

        /* 2. Content Image/Data Plane */
        .layer-content {
            background: linear-gradient(135deg, #222, #1a1a1a);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            transform: translateZ(20px);
            border: 1px solid #333;
        }

        .preview-graphic {
            width: 100%;
            height: 140px;
            background: repeating-linear-gradient(
                45deg,
                #222,
                #222 10px,
                #252525 10px,
                #252525 20px
            );
            border: 1px solid var(--accent);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }
        
        .preview-graphic::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: rgba(0, 240, 255, 0.1);
            transform: rotate(45deg);
        }

        .text-block h2 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .text-block p {
            margin: 0;
            font-size: 0.8rem;
            color: #888;
            line-height: 1.4;
        }

        /* 3. The Vitreous Glass Pane */
        .layer-glass {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid var(--glass-edge);
            box-shadow: 
                inset 0 0 20px rgba(255, 255, 255, 0.05),
                0 4px 10px rgba(0, 0, 0, 0.3);
            transform: translateZ(40px);
        }
        
        /* Refractive highlights */
        .layer-glass::before {
            content: '';
            position: absolute;
            top: 0; 
            left: 0; 
            right: 0; 
            bottom: 0;
            background: linear-gradient(135deg, 
                rgba(255,255,255,0.4) 0%, 
                transparent 20%, 
                transparent 80%, 
                rgba(255,255,255,0.1) 100%);
            z-index: 1;
        }

        /* 4. Floating UI Elements (Badges, Buttons) */
        .layer-ui {
            transform: translateZ(50px);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 20px;
        }

        .badge {
            background: var(--accent);
            color: #000;
            padding: 5px 10px;
            font-size: 0.7rem;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 240, 255, 0.4);
            letter-spacing: 1px;
        }

        .cta-icon {
            width: 30px;
            height: 30px;
            border: 1px solid var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-size: 1.2rem;
            background: rgba(0,0,0,0.8);
        }

        /* Decorative Edges */
        .assembly::before, .assembly::after {
            content: '';
            position: absolute;
            background: var(--accent);
        }
        
        /* Thickness Simulation */
        .side-panel {
            position: absolute;
            background: rgba(255,255,255,0.1);
            transform-origin: left;
        }

    </style>
</head>
<body>

    <div class="scene">
        <div class="assembly">
            <!-- 1. Dark Foundation -->
            <div class="layer layer-base"></div>

            <!-- 2. Information Plane -->
            <div class="layer layer-content">
                <div class="preview-graphic"></div>
                <div class="text-block">
                    <h2>Hyper.Dashboard</h2>
                    <p>Real-time analytics engine with WebGL data visualization nodes.</p>
                </div>
            </div>

            <!-- 3. Vitreous Shield -->
            <div class="layer layer-glass"></div>

            <!-- 4. Floating UI -->
            <div class="layer layer-ui">
                <div class="badge">V.2.0</div>
                <div class="cta-icon">&rarr;</div>
            </div>
        </div>
    </div>

</body>
</html>
