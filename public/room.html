</main><noscript><style>#world{display:none!important}html,body{height:auto;overflow:auto}.static-room{max-width:900px;margin:auto;padding:24px;line-height:1.6}.static-room img{width:100%;height:auto}.static-room a{color:#f6db9b;display:inline-block;min-height:44px;padding:8px 0}.static-room li{padding:12px 0}.static-room p{margin:4px 0}</style><main class="static-room"><h1>Tyler Mayberry</h1><img src="scenes/overview.webp" alt="Tyler’s personal working studio"><p>The interactive room uses JavaScript. You can explore the projects and get in touch here.</p><h2 id="desk/monitor">Projects</h2><ul><li><a href="https://usemasthead.com">Masthead</a><p>The Workbench, drawing from Masthead&#39;s local record of coding-agent sessions, is where you write useful pages from the raw history. Keeping the conversation and keeping the answer are separate steps: reviewed pages go into the Local Logbook, where people and agents can find them again through read-only retrieval.</p></li><li><a href="https://chartstead.com">ChartStead</a><p>A reviewable plan before an action reaches speakers or the audience. (Unfinished work stays visible while organizers put the program together.) Proposals, review, speakers, scheduling and a public agenda, connected by ChartStead. Keep asking, as I did: what is about to happen, and who will it affect?</p></li><li><a href="https://spendwithpip.com">Pip</a><p>Around Spendable Cash Today, Pip builds a read-only conversation. A bank balance can include money already needed for something else. On the web and Android, that&#39;s the experience the project explores. With the application calculating the facts and the agent explaining them, financial logic stays in inspectable code.</p></li><li><a href="https://hotelcleaningschedule.com">Hotel Cleaning Schedule</a><p>A conflict explained, the last valid plan kept, and an exportable room-by-room deep-clean schedule when the work fits: Hotel Cleaning Schedule works from rooms, cleaning capacity, dates and blackouts. The calendar has to be something the team can actually carry out.</p></li><li><a href="https://executionr.com">Executioner</a><p>Grew into an application and open-source release.

From a brain dump, proposed outcomes, steps and a schedule, with capacity and constraints included. Originally, for my own planning. Before committing, a plan to review; at the end, every outcome either executed or abandoned.</p></li><li><a href="https://milk.animasai.co/">Milkbench</a><p>In the actual outputs, you can compare composition, typography and interpretation. That&#39;s MILK Bench. Give coding models the same frozen brief for a prestigious whole-milk launch website, then keep what they make. Compare one playful assignment, with no claim to settle which model is best at everything.</p></li><li><a href="https://wargus.animasai.co">Wargus TypeScript</a><p>From a broad port to one Garden of War match against the computer: gather, build, train and fight. The original project destination, still linked here. Read the scope decision and upstream credits in Notes.

Built around Warcraft II-derived play and Wargus/Stratagus, this was an earlier browser RTS project.</p></li><li><a href="https://rat-detective.animasai.co">Rat Detective Online</a><p>With networking and physics supporting a shared world, Rat Detective Online is a multiplayer browser shooter: detective rats, bouncing cheese balls, a run-down city.

From a silly Three.js prototype came interiors, sewers, hazards and server-owned AI opponents. Within that noir setting, plenty of room for physical comedy.</p></li><li><a href="#contact">Helm</a><p>Helm, a persistent Android assistant project with goals, tasks and evidence beyond a single chat. The underlying story, in Notes. While the system is unfinished, these studio interactions stay inside the demonstration. Try the Tokyo Night handset beside the laptop — a visual preview of the idea.</p></li></ul><h2 id="contact">Contact</h2><a href="mailto:tyler@animasai.co">tyler@animasai.co</a><p><a href="index.html">Outside</a></p></main></noscript><script src="rotation-hint.js" defer></script><button id="fullscreen" type="button" aria-label="Enter full screen" aria-pressed="false" hidden><span aria-hidden="true">⛶</span><span class="fullscreen-label">Full screen</span></button><p id="fullscreen-status" role="status" aria-live="polite"></p></body></html>
