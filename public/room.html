</main><noscript><style>#world{display:none!important}html,body{height:auto;overflow:auto}.static-room{max-width:900px;margin:auto;padding:24px;line-height:1.6}.static-room img{width:100%;height:auto}.static-room a{color:#f6db9b;display:inline-block;min-height:44px;padding:8px 0}.static-room li{padding:12px 0}.static-room p{margin:4px 0}</style><main class="static-room"><h1>Tyler Mayberry</h1><img src="scenes/overview.webp" alt="Tyler’s personal working studio"><p>The interactive room uses JavaScript. You can explore the projects and get in touch here.</p><h2 id="desk/monitor">Projects</h2><ul><li><a href="https://ratdetective.online">Rat Detective Online</a><p>A multiplayer browser shooter where detective rats throw bouncing cheese balls across a run-down noir city. It started as a silly Three.js prototype and grew into streets, interiors, sewers, hazards and server-run AI opponents. The rule I keep: physical comedy stays at the centre, and the atmosphere and networking are there to support it.</p></li><li><a href="https://github.com/MayberryDT/chartroom">Chartroom</a><p>A local second brain built on GBrain, with TypeSafe Jev helping rank searches and suggest connections between pages. Evidence and change history stay inspectable. It's a working preview that runs through MCP and the command line. The small synthetic comparison and its limits are in the repository.</p></li><li><a href="https://chartstead.com">ChartStead</a><p>Conference programming and speaker management: proposals, review, speakers, scheduling and the public agenda, connected in one place. I built it around one question: before an organizer acts, what is about to happen, and who will it affect? Unfinished work stays visible, and anything that reaches speakers or the audience is shown for review first. Live site, sample-data demo and MIT-licensed source.</p></li><li><a href="https://usemasthead.com">Masthead</a><p>Masthead keeps a local record of your coding-agent sessions and helps you turn the useful parts into pages. In the Workbench you write a reviewed page from the raw history. Reviewed pages go into the Local Logbook, where people and agents can find them again through read-only retrieval. The idea: keep the whole record, but start the next session from a reviewed explanation, not a transcript.</p></li><li><a href="https://spendwithpip.com">Pip</a><p>A spending companion built around one number: Spendable Cash Today. A bank balance can include money already promised to upcoming bills; Pip shows what's actually free to spend, on the web and Android. The application does the arithmetic in inspectable code, from read-only account data. The agent explains it, and never makes up the numbers.</p></li><li><a href="https://hotelcleaningschedule.com">Hotel Cleaning Schedule</a><p>Builds a room-by-room deep-clean calendar from rooms, cleaning capacity, dates and blackouts, and exports it when the work fits. A calendar can look convincing while asking a team to do the impossible. So when the work won't fit, it says why and keeps the last plan that worked.</p></li><li><a href="https://executionr.com">Executioner</a><p>A planner that turns a brain dump into outcomes, steps and a schedule that respects your capacity and constraints. I started it when writing everything down still didn't tell me what to do with a day. The schedule stays a proposal until you review it, and every outcome ends as done or deliberately abandoned. It grew into an application and an open-source release.</p></li><li><a href="https://milk.tylermayberry.dev/">Milkbench</a><p>A playful benchmark: coding models get the same frozen brief, a prestigious launch website for whole milk, and the gallery keeps what each one made. You compare composition, typography and interpretation in the actual pages. Runs stay intact, and a changed prompt starts a new comparison. It's one playful assignment, not a claim about which model is best at everything.</p></li><li><a href="https://dow.tylermayberry.dev">Decree of War</a><p>A browser strategy game: one Garden of War match against the computer, where you gather, build, train and fight. It grew out of Wargus TypeScript, my broad attempt to bring Warcraft II-style RTS play to the browser. I narrowed it to one match that works reliably before adding more. The scope decision and upstream credits are in Notes.</p></li><li><a href="#desk/helm">Helm</a><p>A persistent Android assistant I'm still building: goals, tasks, capabilities and evidence belong to the system, not to a single chat. The system is unfinished. The Tokyo Night handset beside the laptop is an interactive visual preview; it doesn't connect to the assistant. The story so far is in Notes.</p></li></ul><h2 id="contact">Contact</h2><a href="mailto:tyler@animasai.co">tyler@animasai.co</a><p><a href="index.html">Outside</a></p></main></noscript><script src="rotation-hint.js" defer></script><button id="fullscreen" type="button" aria-label="Enter full screen" aria-pressed="false" hidden><span aria-hidden="true">⛶</span><span class="fullscreen-label">Full screen</span></button><p id="fullscreen-status" role="status" aria-live="polite"></p></body></html>
